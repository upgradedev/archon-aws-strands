<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Archon film</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0a1020;color:#f5f6fc;font-family:Arial,Helvetica,sans-serif;width:1920px;height:1080px;overflow:hidden}.film{position:relative;width:1920px;height:1080px;padding:90px 120px;background:radial-gradient(ellipse at 90% 20%,#33305880,transparent 58%),radial-gradient(ellipse at 5% 90%,#12443b80,transparent 48%),#0a1020}.grid{position:absolute;inset:0;opacity:.12;background-image:linear-gradient(#7991c144 1px,transparent 1px),linear-gradient(90deg,#7991c144 1px,transparent 1px);background-size:90px 90px;mask-image:linear-gradient(transparent,#000)}.top,.bottom{position:absolute;left:120px;right:120px;display:flex;justify-content:space-between;align-items:center;letter-spacing:3px;font-size:23px;color:#afbbd5}.top{top:65px}.bottom{bottom:55px;letter-spacing:1px;font-size:21px}.brand{color:white;font-weight:800;letter-spacing:8px}.mark{display:inline-block;color:#8ce1c4;margin-right:15px;font-size:40px}.body{position:relative;margin-top:105px}.eyebrow{font-size:23px;letter-spacing:5px;color:#8ce1c4;margin:0 0 24px}h1{font-size:79px;font-weight:600;line-height:1.12;letter-spacing:-3px;max-width:1550px;margin:0 0 38px}h1.big{font-size:146px;letter-spacing:15px}h2{font-size:34px;font-weight:500;line-height:1.35}p{font-size:29px;line-height:1.5;color:#b8c5db;max-width:1450px}.mint{color:#8ce1c4}.cards{display:flex;gap:28px;margin-top:50px}.card{flex:1;background:linear-gradient(140deg,#212a43cc,#121c30cc);border:1px solid #52607d77;border-radius:28px;padding:34px;min-height:215px;box-shadow:0 20px 45px #02051044}.card small{color:#b9b2eb;letter-spacing:2px;font-size:20px}.card strong{display:block;font-size:43px;margin:22px 0 12px}.card p{font-size:25px;margin:0}.amount{font-variant-numeric:tabular-nums;font-size:62px!important}.arrow{color:#8ce1c4;align-self:center;font-size:50px}.chip{display:inline-block;padding:16px 23px;border:1px solid #68b99e77;border-radius:50px;background:#13352e66;color:#a9ecd5;font-size:22px;letter-spacing:1px}.line{height:2px;background:linear-gradient(90deg,#8ce1c4,#9e8ede,transparent);margin:38px 0;transform-origin:left}.infra{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;margin-top:36px}.infra .card{min-height:160px;padding:25px}.infra strong{font-size:31px;margin:12px 0}.infra p{font-size:23px}.reader{display:flex;gap:15px;flex-wrap:wrap;margin:40px 0}.reader span{background:#232b43;border:1px solid #59647d;padding:22px 28px;border-radius:18px;font-size:25px}.flow{display:flex;gap:25px;align-items:center;margin-top:35px}.flow .card{min-height:165px}.flow strong{font-size:36px}.hero{border-left:5px solid #8ce1c4;padding:16px 32px;margin:25px 0 40px;font-size:35px;line-height:1.5}.footnote{font-size:22px;margin-top:30px}.rise{animation:rise 0.9s both}.d1{animation-delay:.35s}.d2{animation-delay:.8s}.d3{animation-delay:1.3s}.d4{animation-delay:2s}.d5{animation-delay:3s}.draw{animation:draw 1.8s .7s both}@keyframes rise{from{opacity:0;transform:translateY(35px)}to{opacity:1;transform:translateY(0)}}@keyframes draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
</style>
<div class="film"><div class="grid"></div><div class="top"><span class="brand"><span class="mark">Λ</span>ARCHON</span><span>STRANDS AGENTS / AWS</span></div><div class="body" id="body"></div><div class="bottom"><span>SOURCE-BACKED BOOKKEEPING</span><span id="footer">PROFESSIONAL AGENTS</span></div></div>
<script>
const scenes={
intro:`<p class="eyebrow rise">SMALL BUSINESS. CLEARER DECISIONS.</p><h1 class="big rise d1">ARCHON</h1><div class="line draw"></div><h2 class="rise d2">Source-backed books.<br><span class="mint">Human-approved collection emails.</span></h2><div class="chip rise d3">Built with Strands Agents on AWS</div>`,
problem:`<p class="eyebrow rise">MEET ALEX / A SMALL JOINERY</p><h1 class="rise d1">The payment arrived.<br>The reminder is <span class="mint">still wrong.</span></h1><div class="cards"><div class="card rise d2"><small>INVOICE EMAIL</small><strong class="amount">€1,860</strong><p>The original amount due</p></div><span class="arrow rise d3">−</span><div class="card rise d3"><small>PAYMENT EMAIL</small><strong class="amount">€600</strong><p>Already recorded as received</p></div><span class="arrow rise d4">=</span><div class="card rise d4"><small>THE RIGHT QUESTION</small><strong class="amount mint">€1,260</strong><p>What actually remains?</p></div></div>`,
promise:`<p class="eyebrow rise">ONE DECISION, WITH ITS EVIDENCE</p><h1 class="rise d1">Check the balance.<br><span class="mint">Then decide.</span></h1><div class="cards"><div class="card rise d2"><small>01 / CONNECT</small><strong>Read the sources</strong><p>Invoice and recorded payment</p></div><div class="card rise d3"><small>02 / VERIFY</small><strong>Check the books</strong><p>Deterministic money arithmetic</p></div><div class="card rise d4"><small>03 / AUTHORIZE</small><strong>Approve the email</strong><p>Exact content. Explicit consent.</p></div></div>`,
architecture:`<p class="eyebrow rise">DEPLOYED INFRASTRUCTURE / EU-WEST-1</p><h1 class="rise d1">A real AWS execution path.</h1><div class="infra"><div class="card rise d1"><small>01 / EXPERIENCE</small><strong>React + Tailwind</strong><p>S3 → CloudFront</p></div><div class="card rise d2"><small>02 / REQUEST</small><strong>API Gateway</strong><p>Lambda API</p></div><div class="card rise d3"><small>03 / EXECUTION</small><strong>Lambda worker</strong><p>Controlled provider operations</p></div><div class="card rise d4"><small>04 / PERSISTENCE</small><strong>Amazon S3</strong><p>Workspace + job records</p></div></div><div class="flow"><div class="card rise d3"><small>MODEL</small><strong>Amazon Bedrock</strong><p>Real Strands Agents execution</p></div><span class="arrow rise d4">→</span><div class="card rise d4"><small>GUARDED CONSEQUENCE</small><strong>Human approval → Amazon SES</strong><p>Exact draft · verified test recipient</p></div></div><p class="footnote rise d5">This deployed application uses S3 persistence. No bank feed or payment execution.</p>`,
strands:`<p class="eyebrow rise">WHY STRANDS AGENTS IS LOAD-BEARING</p><h1 class="rise d1">Read in parallel.<br><span class="mint">Compose after every report.</span></h1><div class="reader rise d2"><span>Suppliers</span><span>Sales</span><span>Payroll</span><span>Trading</span><span>Cash</span><span>Metrics</span></div><div class="flow"><div class="card rise d2"><small>SIX READERS</small><strong>Bounded ledger tools</strong></div><span class="arrow rise d3">→</span><div class="card rise d3"><small>ONE COMPOSER</small><strong>No sending tools</strong></div><span class="arrow rise d4">→</span><div class="card rise d4"><small>APPROVAL GATE</small><strong>Current-book checks</strong></div></div><p class="footnote rise d5">Completion is not consensus. Code governs monetary claims and eligibility.</p>`,
limits:`<p class="eyebrow rise">CLEAR BOUNDARIES</p><h1 class="rise d1">Real providers.<br><span class="mint">Fictional business examples.</span></h1><div class="cards"><div class="card rise d2"><strong>Controlled email</strong><p>Verified test recipient only</p></div><div class="card rise d3"><strong>No bank feed</strong><p>No payment execution</p></div><div class="card rise d4"><strong>Acceptance ≠ delivery</strong><p>Mailbox arrival needs evidence</p></div></div>`,
close:`<p class="eyebrow rise">ARCHON / BUILT WITH STRANDS AGENTS ON AWS</p><h1 class="rise d1">Chase the balance.<br><span class="mint">Not the customer who paid.</span></h1><div class="line draw"></div><h2 class="rise d2">Inspect the sources. Review the wording.<br>Make the decision yourself.</h2><div class="chip rise d3">Live app + open repository linked with this video</div>`};
window.show=(id)=>{if(!scenes[id])throw Error('Unknown scene');document.getElementById('body').innerHTML=scenes[id];document.getAnimations().forEach(a=>a.pause());};
window.seek=(ms)=>document.getAnimations().forEach(a=>{a.pause();a.currentTime=ms});
</script></html>
