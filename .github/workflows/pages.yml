# The walkthrough a judge can open with nothing installed.
#
# Built from the real code on every push, so it cannot drift from what the
# repository actually does: if the ledger changes, these pages change with it,
# and if the gate stops releasing the chase the build fails rather than
# publishing a screenshot of a thing that no longer happens.
#
# Needs the repository to be public and Pages enabled with "GitHub Actions" as
# the source. Both are owner actions and neither is code.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"

      - name: render the walkthrough from the real ledger
        run: |
          python -m archon.web.export site
          python - <<'PY'
          import pathlib

          for name, must_contain in [
              ("index", "Released"),
              ("paid", "books moved while this page was open"),
              ("sent", "message id"),
          ]:
              html = pathlib.Path(f"site/{name}.html").read_text(encoding="utf-8")
              assert must_contain in html, f"{name}.html no longer shows {must_contain!r}"
              assert "<form" not in html, f"{name}.html has a form a static host cannot post"
              assert "A static walkthrough" in html, f"{name}.html does not say what it is"
              print(f"{name}.html ok, {len(html):,} bytes")
          PY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Publishing needs Pages switched on in the repository settings with
      # "GitHub Actions" as the source, and that is an owner action, not code.
      # Until it is done this step 404s. It is allowed to fail rather than
      # painting a red cross on every commit of a repository a judge is about to
      # read: the build job above is the real gate, and it fails properly if the
      # walkthrough stops rendering. What this must not do is fail silently, so
      # the outcome is written into the run summary either way.
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: say plainly whether it published
        run: |
          if [ -n "${{ steps.deployment.outputs.page_url }}" ]; then
            echo "### Published" >> "$GITHUB_STEP_SUMMARY"
            echo "${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Not published, and this is an owner action"
              echo ""
              echo "The pages were built from the real code and are correct; only the"
              echo "deployment was refused. Enable Pages with source \"GitHub Actions\" at"
              echo "https://github.com/${{ github.repository }}/settings/pages and re-run."
              echo ""
              echo "Until then there is no public URL for a judge to open."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
