# Retain the original walkthrough as a downloadable regression artifact.
# The application frontend is deployed only to private S3 / CloudFront.
name: legacy walkthrough artifact

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legacy-walkthrough
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"

      - name: render the walkthrough from the real ledger
        run: |
          python -m archon.web.export site
          python - <<'PY'
          import pathlib

          for name, must_contain in [
              ("index", "Released"),
              ("paid", "books moved while this page was open"),
              ("sent", "message id"),
          ]:
              html = pathlib.Path(f"site/{name}.html").read_text(encoding="utf-8")
              assert must_contain in html, f"{name}.html no longer shows {must_contain!r}"
              assert "<form" not in html, f"{name}.html has a form a static host cannot post"
              assert "A static walkthrough" in html, f"{name}.html does not say what it is"
              print(f"{name}.html ok, {len(html):,} bytes")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: legacy-walkthrough
          path: site
          retention-days: 90
