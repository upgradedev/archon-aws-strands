name: frontend verification

on:
  push:
    branches: ["codex/**", main]
  pull_request:
  workflow_dispatch:
    inputs:
      x1_benchmark:
        description: Run the frozen 20-attempt source-only hero measurement after source checks
        type: boolean
        required: false
        default: false
  workflow_call:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan all retained Git history, redacted
        run: |
          test "$(git rev-parse --is-shallow-repository)" = false
          docker run --rm -v "$PWD:/repo" -v "$RUNNER_TEMP:/evidence" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --log-opts=--all \
            --redact --report-format json --report-path /evidence/gitleaks-history.json
      - name: Retain redacted full-history scan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-history-${{ github.run_id }}
          path: ${{ runner.temp }}/gitleaks-history.json
          retention-days: 90
          if-no-files-found: error
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      ARCHON_SESSION_DB: /tmp/archon-browser-tests.sqlite3
      ARCHON_COMMIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python dependencies on the runner only
        run: python -m pip install -e ".[dev]" httpx==0.28.1
      - name: Pin the dependency resolver on the runner only
        run: |
          npm install --global npm@11.19.1 --ignore-scripts
          npm --version
      - name: Generate a lock only for the bootstrap run
        working-directory: frontend
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --logs-dir=artifacts/npm-logs
          fi
          npm ci --logs-dir=artifacts/npm-logs
      - name: Preserve generated lock for immutable follow-up
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-lock-${{ github.run_id }}
          retention-days: 90
          path: frontend/package-lock.json
      - name: Runtime dependency audit and full audit evidence
        working-directory: frontend
        run: |
          mkdir -p artifacts
          npm audit --json > artifacts/npm-audit-full.json || true
          npm audit --omit=dev --audit-level=low
      - name: Build React TypeScript Tailwind application
        id: build
        working-directory: frontend
        run: npm run build
      - name: Unit tests and measured coverage
        if: always() && steps.build.outcome == 'success'
        working-directory: frontend
        run: npm test
      - name: Python regression and real API functional tests
        if: always()
        run: |
          python -m pytest --junitxml=frontend/artifacts/python-junit.xml --cov --cov-report=xml:frontend/artifacts/python-coverage.xml --cov-report=term-missing
      - name: Python lint
        if: always()
        run: python -m ruff check src tests
      - name: Render current Markdown and diagrams for browser review
        if: always()
        run: python tools/docs_review.py frontend/artifacts/docs-review
      - name: Early build and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-checkpoint-${{ github.run_id }}
          retention-days: 90
          path: |
            frontend/dist/
            frontend/artifacts/
            frontend/coverage/
      - name: Real HTTP browser journeys, desktop and mobile
        if: always() && steps.build.outcome == 'success'
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium webkit
          npm run test:e2e
      - name: Live-mode UI API worker contracts with CI-only provider doubles
        if: always() && steps.build.outcome == 'success'
        working-directory: frontend
        env:
          ARCHON_LIVE_ACCEPTANCE: "true"
          ARCHON_FAKE_PROVIDERS: "true"
        run: npm run test:e2e -- --forbid-only
      - name: Acceptance renderer contracts with synthetic HTTP, not live AWS evidence
        if: always() && steps.build.outcome == 'success'
        working-directory: frontend
        run: npx playwright test --config playwright.proof.config.ts --forbid-only
      - name: Review screenshots without downloading traces and videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots-${{ github.run_id }}
          path: frontend/test-results/**/*.png
          retention-days: 90
          if-no-files-found: warn
      - name: Documentation and diagram review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-visuals-${{ github.run_id }}
          path: frontend/proof-results/**/docs-*.png
          retention-days: 90
          if-no-files-found: error
      - name: Compact closeout visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: closeout-visuals-${{ github.run_id }}
          path: |
            frontend/test-results/**/cold-main-paint.png
            frontend/test-results/**/counterproposal-retained.png
            frontend/test-results/**/reader-conflict-held.png
          retention-days: 90
          if-no-files-found: warn
      - name: Evidence and deployable static build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-evidence-${{ github.run_id }}
          path: |
            frontend/dist/
            frontend/artifacts/
            frontend/coverage/
            frontend/playwright-report/
            frontend/test-results/
            frontend/live-contract-results/
            frontend/live-contract-report/
            frontend/proof-results/
            frontend/UAT.testbook.json
            frontend/UAT.testbook.html
          retention-days: 90

  x1-source-benchmark:
    if: github.event_name == 'workflow_dispatch' && inputs.x1_benchmark == true
    needs: [secrets, verify]
    runs-on: ubuntu-24.04
    # Installation/build and artifact upload are outside the separately enforced 15-minute invocation.
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      ARCHON_SESSION_DB: /tmp/archon-x1.sqlite3
      ARCHON_COMMIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Existing Python dependencies, CI runner only
        run: python -m pip install -e ".[dev]" httpx==0.28.1
      - name: Existing locked browser dependencies, CI runner only
        working-directory: frontend
        run: |
          npm install --global npm@11.19.1 --ignore-scripts
          npm ci --logs-dir=artifacts/x1-npm-logs
          npx playwright install --with-deps chromium
      - name: Build exact source frontend before timing
        working-directory: frontend
        run: npm run build
      - name: One frozen source-only invocation, no retries or replacement samples
        working-directory: frontend
        run: node benchmarks/run.mjs
      - name: Retain raw outcomes including failed and unstarted slots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x1-source-${{ github.run_id }}-${{ github.sha }}
          include-hidden-files: true
          path: |
            frontend/artifacts/x1/final/
            frontend/benchmarks/x1-protocol.json
          retention-days: 90
          if-no-files-found: error
