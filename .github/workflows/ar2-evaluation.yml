name: AR2 synthetic evaluation

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install only on the runner
        run: python -m pip install -e ".[dev]" httpx==0.28.1
      - name: Instrument lint and negative controls
        id: instrument
        run: |
          python -m ruff check evaluation tests/test_ar2_evaluation.py
          python -m pytest tests/test_ar2_evaluation.py --junitxml=ar2-instrument-junit.xml
      - name: Measure exact candidate even if an instrument assertion failed
        if: always() && !cancelled()
        run: |
          python -m evaluation.ar2 --candidate-sha "$CANDIDATE_SHA" --output ar2-output
      - name: Prove deterministic rerun without replacing the first result
        if: always() && !cancelled()
        run: |
          python -m evaluation.ar2 --candidate-sha "$CANDIDATE_SHA" --output ar2-repeat
          cmp ar2-output/result.json ar2-repeat/result.json
          cmp ar2-output/source-sha256.json ar2-repeat/source-sha256.json
          cd ar2-output
          sha256sum --check SHA256SUMS
      - name: Retain results and failing receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ar2-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ar2-output/
            ar2-repeat/
            ar2-instrument-junit.xml
          retention-days: 90
          if-no-files-found: error
