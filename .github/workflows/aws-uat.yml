name: Live AWS acceptance
on:
  workflow_call:
    inputs:
      release_sha:
        description: Exact frontend commit published by the caller
        required: true
        type: string
      backend_sha:
        description: Exact compatible backend observed before frontend publication
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full commit SHA reported by the deployed release.json
        required: true
        type: string
      backend_sha:
        description: Full backend commit SHA reported by API health
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: archon-live-acceptance
  cancel-in-progress: false
  queue: max
jobs:
  acceptance:
    runs-on: ubuntu-latest
    outputs:
      receipt_artifact: ${{ steps.receipt.outputs.artifact }}
      receipt_attempt: ${{ steps.receipt.outputs.attempt }}
    permissions:
      contents: read
    timeout-minutes: 20
    env:
      ARCHON_UI_URL: https://d2ssmv59q16d0b.cloudfront.net/
      EXPECTED_RELEASE: ${{ inputs.release_sha }}
      EXPECTED_BACKEND: ${{ inputs.backend_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify real AWS release before any synthetic action
        id: preflight
        run: |
          python -c 'import os,re; assert re.fullmatch("[0-9a-f]{40}", os.environ["EXPECTED_RELEASE"]), "Full release SHA required"'
          python infra/frontend_smoke.py --url "$ARCHON_UI_URL" --sha "$EXPECTED_RELEASE"
          python infra/release_acceptance.py pair --sha "$EXPECTED_RELEASE" --backend "$EXPECTED_BACKEND" --output acceptance-preflight.json
      - name: Install browser tools on CI only
        working-directory: frontend
        run: |
          npm install --global npm@11.19.1 --ignore-scripts
          npm ci
          npm audit --omit=dev --audit-level=low
          npx playwright install --with-deps chromium webkit
      - name: Real CloudFront API and durable AWS workspace journeys
        id: journeys
        working-directory: frontend
        run: npm run test:e2e -- --forbid-only
      - name: Verify the tested release did not change during the journeys
        id: postflight
        if: always() && steps.journeys.outcome != 'skipped'
        run: |
          python infra/frontend_smoke.py --url "$ARCHON_UI_URL" --sha "$EXPECTED_RELEASE"
          python infra/release_acceptance.py pair --sha "$EXPECTED_RELEASE" --backend "$EXPECTED_BACKEND" --output acceptance-postflight.json
      - name: Prepare sanitized observed acceptance summary
        id: receipt
        env:
          PREFLIGHT: ${{ steps.preflight.outcome }}
          JOURNEYS: ${{ steps.journeys.outcome }}
          POSTFLIGHT: ${{ steps.postflight.outcome }}
        run: |
          python infra/release_acceptance.py receipt --output acceptance.json
          echo "artifact=acceptance-summary-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "attempt=${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Hand only aggregate evidence to separate publisher
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: acceptance.json
          retention-days: 90
          if-no-files-found: error
      - name: Summarize automated evidence without human signoff
        if: always()
        env:
          PREFLIGHT: ${{ steps.preflight.outcome }}
          JOURNEYS: ${{ steps.journeys.outcome }}
          POSTFLIGHT: ${{ steps.postflight.outcome }}
        run: |
          printf '### Live AWS Playwright acceptance\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf 'Frontend commit: %s\n\nPreflight: %s | Playwright: %s | Postflight: %s\n\n' "$EXPECTED_RELEASE" "$PREFLIGHT" "$JOURNEYS" "$POSTFLIGHT" >> "$GITHUB_STEP_SUMMARY"
          printf 'Backend commit: %s\n\nEvidence: aws-acceptance-%s (HTML report, JUnit, traces, screenshots, testbook).\n\nHuman UAT: NOT_RUN. Backend compatibility and identity are checked before/after acceptance.\n' "$EXPECTED_BACKEND" "$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep observed results separate from human acceptance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aws-acceptance-${{ github.run_id }}
          path: |
            frontend/test-results/
            frontend/artifacts/browser-junit.xml
            frontend/playwright-report/
            frontend/UAT.testbook.*
            acceptance-preflight.json
            acceptance-postflight.json
          retention-days: 90
          if-no-files-found: error
  publish:
    name: Publish current release evidence without browser credentials
    needs: acceptance
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: archon-frontend-writer
      cancel-in-progress: false
      queue: max
    env:
      ACCEPTANCE_RUN_ATTEMPT: ${{ needs.acceptance.outputs.receipt_attempt }}
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.acceptance.outputs.receipt_artifact }}
          path: acceptance-summary
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.FRONTEND_RELEASE_ROLE_ARN }}
          aws-region: eu-west-1
      - name: Publish sanitized receipt only for the still-served pair
        run: python infra/release_acceptance.py publish --receipt acceptance-summary/acceptance.json
