name: ci

on:
  push:
    branches: [main, "build/**", "codex/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # Assert the SDK surface used by the actual graph.
      - name: the Strands surface this build depends on actually exists
        run: |
          python -m pip show strands-agents | head -3
          python - <<'PY'
          import inspect
          from strands import Agent
          from strands.multiagent import GraphBuilder

          builder = GraphBuilder()
          for name in ("add_node", "add_edge", "build"):
              assert hasattr(builder, name), f"GraphBuilder has no {name}"
              print(f"GraphBuilder.{name}{inspect.signature(getattr(builder, name))}")
          print("Agent:", inspect.signature(Agent.__init__))
          PY

      # Everything the Bedrock wiring needs, printed rather than recalled: what a
      # Model must implement so a stub can stand in for one offline, and what
      # BedrockModel defaults to so the model id is evidence and not a guess.
      - name: the model surface, printed not recalled
        run: |
          python - <<'PY'
          import inspect

          from strands.models.model import Model

          print("Model abstract methods:", sorted(getattr(Model, "__abstractmethods__", ())))
          for name, member in inspect.getmembers(Model, predicate=inspect.isfunction):
              if not name.startswith("_"):
                  print(f"  Model.{name}{inspect.signature(member)}")

          try:
              from strands.models import BedrockModel
          except ImportError as exc:
              print("BedrockModel not importable:", exc)
          else:
              print("BedrockModel.__init__:", inspect.signature(BedrockModel.__init__))
              for attr in ("DEFAULT_MODEL_ID", "DEFAULT_BEDROCK_MODEL_ID", "DEFAULT_BEDROCK_REGION"):
                  if hasattr(BedrockModel, attr):
                      print(f"  BedrockModel.{attr} =", getattr(BedrockModel, attr))

          import strands.models.bedrock as bedrock_mod
          print("bedrock module constants:")
          for name in dir(bedrock_mod):
              if name.isupper():
                  print(f"  {name} =", getattr(bedrock_mod, name))
          cfg = getattr(bedrock_mod.BedrockModel, "BedrockConfig", None)
          if cfg is not None:
              print("BedrockConfig keys:", sorted(getattr(cfg, "__annotations__", {})))

          print("strands.models exports:", [n for n in dir(__import__("strands.models", fromlist=["x"])) if not n.startswith("_")])

          import strands.types.streaming as st
          print("streaming exports:", [n for n in dir(st) if not n.startswith("_")])
          for name in ("StreamEvent", "ContentBlockDeltaEvent", "MessageStartEvent"):
              obj = getattr(st, name, None)
              if obj is not None:
                  print(f"  {name} keys:", sorted(getattr(obj, "__annotations__", {})))
          PY

      # J4 says a graph of Strands agents is load-bearing. This builds the real
      # one. It needs no model call and no AWS credential, so a failure here is
      # a wiring failure and nothing else.
      - name: the graph this project claims as its hero actually constructs
        run: |
          python - <<'PY'
          from datetime import date
          from archon.agents.graph import build, COMPOSER
          from archon.domain.books import Books

          graph = build(Books(), date(2026, 9, 3), date(2026, 7, 1), date(2026, 9, 3))
          print("graph built:", type(graph).__name__)
          assert graph is not None
          print("nodes wired into", COMPOSER)
          PY

      # agents/gating.py reads GraphState defensively because this repo does not
      # get to assume an attribute name. This prints the real shape so the guess
      # can be replaced with evidence, and asserts every composer edge carries a
      # condition. Under Python's OR semantics an unconditioned edge would let
      # the composer start on one report.
      - name: the six-domain requirement is structural, not instructed
        run: |
          python - <<'PY'
          import dataclasses
          from datetime import date

          from strands.multiagent.graph import GraphState

          from archon.agents import wiring
          from archon.agents.graph import build
          from archon.domain.books import Books

          fields = [f.name for f in dataclasses.fields(GraphState)]
          print("GraphState fields:", fields)
          for expected in ("results", "completed_nodes"):
              print(f"  {expected!r} present:", expected in fields)

          graph = build(Books(), date(2026, 9, 3), date(2026, 7, 1), date(2026, 9, 3))
          edges = list(getattr(graph, "edges", []))
          print("edges:", len(edges))
          assert len(edges) == len(wiring.REQUIRED_REPORTS), edges
          unconditioned = [e for e in edges if getattr(e, "condition", None) is None]
          assert not unconditioned, f"edges with no condition: {unconditioned}"
          print("every edge into the composer carries a condition")
          PY

      - name: lint
        run: python -m ruff check src tests

      # No key, no network, no AWS account. A suite that needs credentials is a
      # suite that cannot prove anything to a judge who has none.
      - name: tests, offline
        run: python -m pytest --cov --cov-report=term-missing

      # The screen is a deliverable, so it is asserted like one: it renders, it
      # holds the gate through a browser round trip, and it fetches nothing from
      # anybody else's host.
      - name: the screen renders and enforces the gate
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient

          from archon.web.app import app, session

          session.reset()
          html = TestClient(app).get("/").text
          assert "Cafe on the corner owes 2,000.00 EUR" in html, "the hero figure is missing"
          assert "Invoice SI-001 is still outstanding at 2,000.00 EUR." in html
          assert "<script" not in html.lower() and "cdn" not in html.lower()
          print("screen renders,", len(html), "bytes, no external asset")
          PY

      # STANDARDS asks for zero discrepancy between the README, the code, the
      # video and the description. That row is usually kept by somebody
      # remembering. tests/test_readme_is_true.py keeps it by failing, and this
      # step runs it on its own so the reason is legible when it does.
      # S4 asks that the repository hold everything needed for the project to be
      # functional, which is the row that fails silently: a file listing looks
      # complete right up until somebody clones it. This runs the quickstart the
      # README prints, on a clean runner, from a clean checkout, with nothing on
      # the machine but what pyproject declares. A command that only works
      # because of something on the author's laptop dies here.
      - name: the quickstart a judge is told to run
        run: |
          python -m archon.demo | tail -3
          python -m archon.evidence.compare | tail -4
          python -m archon.evidence.compare --hard | tail -4
          python -m archon.web.export "$RUNNER_TEMP/site"
          test -s "$RUNNER_TEMP/site/index.html"
          python -m archon.evidence.licences | tail -3
          timeout 20 python -m uvicorn archon.web.app:app --port 8123 &
          for _ in $(seq 1 20); do
            curl -sf http://127.0.0.1:8123/ >/dev/null && break || sleep 1
          done
          curl -sf http://127.0.0.1:8123/ | grep -q "Cafe on the corner owes"
          echo "the screen served the hero figure from a clean install"

      - name: the README is still true
        run: python -m pytest tests/test_readme_is_true.py -q

      - name: the domain core imports nothing it should not
        run: |
          python - <<'PY'
          import pathlib, re, sys

          banned = re.compile(r"^\s*(import|from)\s+(boto3|strands|botocore)\b", re.M)
          bad = [
              p for p in pathlib.Path("src/archon/domain").rglob("*.py")
              if banned.search(p.read_text(encoding="utf-8"))
          ]
          if bad:
              sys.exit(f"the domain core must stay offline and SDK-free: {bad}")
          print("domain core is free of boto3 and strands")
          PY

  ar3-source-preparation:
    # Source branch/PR checks only. No live workflow, credentials or activation input.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Existing dependencies on CI runner only
        run: python -m pip install -e ".[dev]" httpx==0.28.1
      - name: Instrument lint and offline negative controls
        run: |
          python -m ruff check evaluation/ar3.py tests/test_ar3_evaluation.py
          python -m pytest tests/test_ar3_evaluation.py --junitxml=ar3-instrument-junit.xml
      - name: Prepare baseline evidence and inert exact requests, never invoke a model
        if: always() && !cancelled()
        run: python -m evaluation.ar3 --candidate-sha "$CANDIDATE_SHA" --output ar3-output
      - name: Verify retained evidence checksums
        if: always() && !cancelled()
        run: cd ar3-output && sha256sum --check SHA256SUMS
      - name: Retain source preparation and failures without replacing prior runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ar3-source-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ar3-output/
            ar3-instrument-junit.xml
          retention-days: 90
          if-no-files-found: error
