[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "archon"
version = "0.1.0"
description = "The back office that lives in an inbox. Email in, books kept, one approved email out."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "strands-agents>=1.53.0",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/archon"]
branch = true
omit = [
    # The only module that imports the SDK. It cannot be exercised without
    # strands installed, and counting its lines here would report a number no
    # local test can reach, which is the coverage equivalent of inferring a
    # pass from absent evidence. CI builds the real graph instead, in the step
    # named "the graph this project claims as its hero actually constructs".
    "src/archon/agents/graph.py",
]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
