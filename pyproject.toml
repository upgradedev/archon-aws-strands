[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "archon"
version = "0.1.0"
description = "The back office that lives in an inbox. Email in, books kept, one approved email out."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "strands-agents>=1.53.0",
    "boto3>=1.34",
    # The screen. Server-rendered with no build step, no template engine and no
    # CDN, so these two are the whole front end.
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
    # Real invoices arrive as PDF attachments. The text is extracted locally so
    # that redaction still applies before anything is sent; handing the file to
    # Bedrock would read it well and would also hand over the IBAN on it.
    "pypdf>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/archon"]
branch = true
# Nothing is omitted. An earlier version of this file excluded graph.py on the
# stated ground that the SDK could not be installed here. That was wrong: it was
# already installed, and the graph is exercised by tests/test_graph_runs.py
# against a scripted model. The claim was never checked, which is the failure the
# rest of this repo is built to avoid, so the exclusion is gone rather than
# rewritten with a better excuse.

[tool.coverage.report]
show_missing = true
fail_under = 85

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# B008 exists because a mutable default evaluated once is a bug. FastAPI's
# Depends/Form/File in a default is how the framework declares where a parameter
# comes from, and it is evaluated once on purpose. Told here rather than silenced
# with a noqa at each call site, so the reason is in one place.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form", "fastapi.File", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
# render.py holds the stylesheet and the markup as literal strings. Wrapping CSS
# rules and HTML attributes to a Python line limit makes both harder to read and
# harder to diff, and neither is Python. Every other file keeps the limit.
"src/archon/web/render.py" = ["E501"]
