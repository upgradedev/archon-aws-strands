<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Archon: know what is owed, approve what is sent</title>
  <desc id="desc">Editorial product banner. Source-backed books flow to a Strands review and then exact human approval. It is not a screenshot or performance evidence.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#141b30"/><stop offset="1" stop-color="#282146"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#a79af1"/><stop offset="1" stop-color="#80dbc0"/></linearGradient>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#background)"/>
  <path d="M40 330H1160" stroke="url(#accent)" stroke-width="3"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="48" y="66" fill="#b9aaef" font-size="17" letter-spacing="5">ARCHON / THE INBOX LEDGER</text>
    <text x="48" y="120" fill="#f4f4fa" font-size="38" font-weight="700">Know what is owed.</text>
    <text x="48" y="169" fill="#a0ead4" font-size="38" font-weight="700">Approve what is sent.</text>
    <text x="49" y="206" fill="#c6cadd" font-size="17">Source-backed bookkeeping for independent joiners.</text>
    <g transform="translate(48 239)">
      <rect width="328" height="63" rx="12" fill="#232c43" stroke="#53647d"/>
      <text x="20" y="27" fill="#a6e4d1" font-size="13" letter-spacing="2">01 / RECORDS</text>
      <text x="20" y="49" fill="#eef0f8" font-size="16">Invoices, credits and cash evidence</text>
    </g>
    <path d="M384 271h22m-7-7 7 7-7 7" fill="none" stroke="#b2a2ef" stroke-width="2"/>
    <g transform="translate(420 239)">
      <rect width="328" height="63" rx="12" fill="#2e2948" stroke="#8b79b6"/>
      <text x="20" y="27" fill="#c6b5f6" font-size="13" letter-spacing="2">02 / STRANDS AGENTS</text>
      <text x="20" y="49" fill="#eef0f8" font-size="16">Six readers. One checked draft.</text>
    </g>
    <path d="M756 271h22m-7-7 7 7-7 7" fill="none" stroke="#b2a2ef" stroke-width="2"/>
    <g transform="translate(792 239)">
      <rect width="360" height="63" rx="12" fill="#193f3c" stroke="#62a58f"/>
      <text x="20" y="27" fill="#a6e4d1" font-size="13" letter-spacing="2">03 / YOUR APPROVAL</text>
      <text x="20" y="49" fill="#eef0f8" font-size="16">Exact content. Controlled email.</text>
    </g>
    <rect x="868" y="48" width="284" height="38" rx="19" fill="#39304f" stroke="#726492"/>
    <text x="890" y="73" fill="#e1d9f8" font-size="14">BUILT WITH STRANDS + BEDROCK</text>
  </g>
</svg>
