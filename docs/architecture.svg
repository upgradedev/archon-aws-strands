      .amber-text { fill: #805010; }
      .muted { fill: #425c72; }
      .card { fill: #ffffff; stroke: #7891a6; stroke-width: 2; }
      .provider { fill: #e8f6f2; stroke: #16776c; stroke-width: 2; }
      .control { fill: #fff4dc; stroke: #a66d19; stroke-width: 2; }
      .boundary { fill: #f0f5fa; stroke: #7891a6; stroke-width: 2; }
      .opt-in { fill: #fffaf0; stroke: #a66d19; stroke-width: 2.5; stroke-dasharray: 9 7; }
      .flow { fill: none; stroke: #31546f; stroke-width: 3; stroke-linejoin: round; marker-end: url(#arrow); }
      .bus { fill: none; stroke: #31546f; stroke-width: 3; stroke-linejoin: round; }
      .opt-in-flow { fill: none; stroke: #956019; stroke-width: 3; stroke-dasharray: 9 7; stroke-linejoin: round; marker-end: url(#amber-arrow); }
      .hold-flow { fill: none; stroke: #956019; stroke-width: 3; stroke-linejoin: round; marker-end: url(#amber-arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#31546f"/></marker>
    <marker id="amber-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#956019"/></marker>
  </defs>
  <rect width="1200" height="2360" fill="#ffffff"/>
  <rect x="40" y="40" width="8" height="76" rx="4" fill="#16776c"/>
  <text x="68" y="76" class="title">Archon · application architecture</text>
  <text x="68" y="115" class="subtitle">Retained evidence → ledger facts → advice → an approved action</text>
  <g aria-label="Data and runtime distinction">
    <rect x="40" y="148" width="1120" height="88" rx="14" class="boundary"/>
    <text x="64" y="183" class="heading">Fictional business data. Real providers in controlled-live mode.</text>
    <text x="64" y="216" class="body muted">Manual intake or opt-in HTTP ingress. Enable the incoming extension per workspace.</text>
  </g>
  <g aria-label="Workspace and input paths">
    <rect x="40" y="294" width="330" height="164" rx="14" class="card"/>
    <text x="64" y="330" class="heading">React workspace</text>
    <text x="64" y="366" class="body">Fresh or retained session</text>
    <text x="64" y="398" class="body">Restore previous records</text>
    <text x="64" y="430" class="small muted">Opening does not call providers</text>
    <path d="M 370 376 H 422" class="flow"/>
    <rect x="424" y="294" width="320" height="164" rx="14" class="card"/>
    <text x="448" y="330" class="heading">Manual text intake</text>
    <text x="448" y="366" class="body">Paste fictional evidence</text>
    <text x="448" y="398" class="body">English · EUR · ISO dates</text>
    <text x="448" y="430" class="small muted">Explicit user action</text>
    <rect x="802" y="272" width="358" height="242" rx="14" class="opt-in"/>
    <text x="824" y="306" class="label amber-text">OPT-IN INCOMING</text>
    <text x="824" y="344" class="heading">HTTP webhook</text>
    <text x="824" y="376" class="body">POST /api/incoming</text>
    <text x="824" y="410" class="body">External mail / export system</text>
    <text x="824" y="442" class="small">Opt-in · one session · ingest only</text>
    <text x="824" y="470" class="small">Bearer capability; separate from</text>
    <text x="824" y="497" class="small">the workspace credential</text>
    <path d="M 584 458 V 550" class="flow"/>
    <path d="M 981 514 V 532 H 830 V 550" class="opt-in-flow"/>
    <rect x="274" y="552" width="652" height="112" rx="14" class="card"/>
    <text x="298" y="592" class="heading">Shared API → private worker</text>
    <text x="298" y="628" class="body">Durable event / request before async dispatch</text>
    <text x="1050" y="564" class="small amber-text" text-anchor="middle">Webhook stops</text>
    <text x="1050" y="592" class="small amber-text" text-anchor="middle">at intake;</text>
    <text x="1050" y="620" class="small amber-text" text-anchor="middle">no draft or send</text>
  </g>
  <g aria-label="Semantic intake, deterministic validation and ledger">
    <path d="M 430 664 V 692 H 192 V 728" class="flow"/>
    <rect x="40" y="730" width="304" height="152" rx="14" class="provider"/>
    <text x="64" y="766" class="label teal-text">REAL PROVIDER</text>
    <text x="64" y="804" class="heading">Bedrock intake</text>
    <text x="64" y="838" class="body">Semantic field extraction</text>
    <text x="64" y="868" class="small muted">Bounded, redacted input</text>
    <path d="M 344 806 H 418" class="flow"/>
    <polygon points="560,704 700,806 560,908 420,806" class="control"/>
    <text x="560" y="788" class="heading" text-anchor="middle">Source checks</text>
    <text x="560" y="821" class="body" text-anchor="middle">pass?</text>
    <text x="560" y="851" class="small" text-anchor="middle">Facts + identity</text>
    <path d="M 700 806 H 798" class="flow"/>
    <text x="729" y="791" class="small teal-text">yes</text>
    <path d="M 800 756 A 180 24 0 0 1 1160 756 V 860 A 180 24 0 0 1 800 860 Z" class="boundary"/>
    <ellipse cx="980" cy="756" rx="180" ry="24" class="boundary"/>
    <text x="980" y="802" class="heading" text-anchor="middle">Deterministic ledger</text>
    <text x="980" y="836" class="body" text-anchor="middle">Post only validated evidence</text>
    <text x="980" y="868" class="small" text-anchor="middle">Amounts, identities, balances</text>
    <path d="M 560 908 V 969 H 482" class="hold-flow"/>
    <text x="578" y="941" class="small amber-text">refuse</text>
    <rect x="40" y="928" width="440" height="92" rx="14" class="control"/>
    <text x="64" y="964" class="heading">Hold → human correction</text>
    <text x="64" y="998" class="body">Retain source history; revalidate</text>
    <text x="650" y="944" class="small muted">Checks do not establish</text>
    <text x="650" y="974" class="small muted">authenticity or bank settlement.</text>
    <path d="M 980 884 V 1038 H 24 V 1197 H 40" class="bus"/>
    <text x="376" y="1067" class="small">Ingress ends at the ledger. Reasoning needs a separate user action.</text>
  </g>
  <g aria-label="Six-reader Strands graph with an all-reports gate">
    <rect x="40" y="1090" width="1120" height="470" rx="18" class="boundary"/>
    <text x="68" y="1129" class="heading">Live Amazon Bedrock via Strands</text>
    <text x="68" y="1163" class="body muted">Six readers · one bounded, read-only ledger tool each</text>
    <path d="M 40 1197 H 76 V 1477" class="bus"/>
    <path d="M 76 1197 H 114" class="flow"/>
    <path d="M 76 1253 H 114" class="flow"/>
    <path d="M 76 1309 H 114" class="flow"/>
    <path d="M 76 1365 H 114" class="flow"/>
    <path d="M 76 1421 H 114" class="flow"/>
    <path d="M 76 1477 H 114" class="flow"/>
    <rect x="116" y="1176" width="292" height="42" rx="8" class="card"/>
    <rect x="116" y="1232" width="292" height="42" rx="8" class="card"/>
    <rect x="116" y="1288" width="292" height="42" rx="8" class="card"/>
    <rect x="116" y="1344" width="292" height="42" rx="8" class="card"/>
    <rect x="116" y="1400" width="292" height="42" rx="8" class="card"/>
    <rect x="116" y="1456" width="292" height="42" rx="8" class="card"/>
    <text x="138" y="1204" class="body"><tspan>suppliers</tspan><tspan> · amounts owed</tspan></text>
    <text x="138" y="1260" class="body"><tspan>sales</tspan><tspan> · open invoices</tspan></text>
    <text x="138" y="1316" class="body"><tspan>payroll</tspan><tspan> · payment state</tspan></text>
    <text x="138" y="1372" class="body"><tspan>trading</tspan><tspan> · profit and loss</tspan></text>
    <text x="138" y="1428" class="body"><tspan>cash</tspan><tspan> · recorded receipts</tspan></text>
    <text x="138" y="1484" class="body"><tspan>metrics</tspan><tspan> · headline position</tspan></text>
    <path d="M 408 1197 H 490" class="flow"/>
    <path d="M 408 1253 H 490" class="flow"/>
    <path d="M 408 1309 H 490" class="flow"/>
    <path d="M 408 1365 H 490" class="flow"/>
    <path d="M 408 1421 H 490" class="flow"/>
    <path d="M 408 1477 H 490" class="flow"/>
    <path d="M 490 1197 V 1477" class="bus"/>
    <path d="M 490 1337 H 514" class="flow"/>
    <polygon points="622,1257 728,1337 622,1417 516,1337" class="control"/>
    <text x="622" y="1328" class="body" text-anchor="middle">All six</text>
    <text x="622" y="1357" class="body" text-anchor="middle">reports?</text>
    <path d="M 728 1337 H 758" class="flow"/>
    <text x="730" y="1314" class="small teal-text">yes</text>
    <rect x="760" y="1254" width="352" height="166" rx="14" class="provider"/>
    <text x="784" y="1293" class="heading">Toolless composer</text>
    <text x="784" y="1328" class="body">Proposes opening + closing</text>
    <text x="784" y="1362" class="body">Ledger supplies the figures</text>
    <text x="784" y="1396" class="small muted">Composer holds no tools</text>
    <text x="552" y="1466" class="body amber-text">Missing report → no draft</text>
    <text x="552" y="1502" class="small muted">Reports: URGENT · WATCH · FINE</text>
    <text x="68" y="1535" class="small muted">Each domain reads the fictional books. The cash reader is not a bank connection.</text>
  </g>
  <g aria-label="Human approval, durable outbox and controlled email">
    <path d="M 1112 1337 H 1180 V 1604 H 205 V 1666" class="flow"/>
    <text x="378" y="1640" class="body">Review the exact draft; approval is a separate action</text>
    <rect x="40" y="1668" width="330" height="200" rx="14" class="control"/>
    <text x="62" y="1708" class="heading">Exact human approval</text>
    <text x="62" y="1747" class="body">Recipient · subject · body</text>
    <text x="62" y="1781" class="small">SHA-256 + real-email consent</text>
    <text x="62" y="1815" class="body">Recheck ledger + expiry</text>
    <text x="62" y="1849" class="small amber-text">Any failed check holds the send</text>
    <path d="M 370 1768 H 428" class="flow"/>
    <text x="399" y="1752" text-anchor="middle" font-size="14" fill="#08665f">released</text>
