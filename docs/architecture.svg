    <text x="700" y="2243" class="small">Required gate</text>
    <path d="M 917 2236 H 963" class="opt-in-flow"/>
    <text x="977" y="2243" class="small">Opt-in ingress</text>
    <text x="40" y="2289" class="small muted">Cylinders: durable storage. No direct mailbox / bank feed, deployed Aurora or AgentCore.</text>
    <text x="40" y="2330" class="small muted">Source architecture; verify served SHAs and exact-pair acceptance for live deployment.</text>
  </g>
</svg>
