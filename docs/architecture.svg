    <text x="591" y="1783" class="body" text-anchor="middle">Reserve before sending</text>
    <text x="591" y="1817" class="body" text-anchor="middle">Atomic, fingerprint keyed</text>
    <text x="591" y="1845" class="small" text-anchor="middle">Private S3 provider journal</text>
    <path d="M 752 1768 H 848" class="flow"/>
    <rect x="850" y="1680" width="310" height="174" rx="14" class="provider"/>
    <text x="874" y="1716" class="label teal-text">REAL PROVIDER</text>
    <text x="874" y="1755" class="heading">Controlled SES</text>
    <text x="874" y="1790" class="body">Verified test recipient</text>
    <text x="874" y="1824" class="body">Finite grant + expiry</text>
    <path d="M 1005 1854 V 1902" class="flow"/>
    <rect x="430" y="1904" width="730" height="112" rx="14" class="card"/>
    <text x="454" y="1940" class="heading">Accepted / failed / unknown retained</text>
    <text x="454" y="1973" class="body">Provider ID proves acceptance, not mailbox delivery.</text>
    <text x="454" y="2003" class="small">Unknown sends require reconciliation; no automatic resend.</text>
    <path d="M 205 1868 V 1902" class="hold-flow"/>
    <text x="220" y="1894" class="small amber-text">held</text>
    <rect x="40" y="1904" width="330" height="112" rx="14" class="control"/>
    <text x="62" y="1940" class="small amber-text">Held — nothing is sent</text>
    <text x="62" y="1973" class="small">Review current evidence.</text>
    <text x="62" y="2003" class="small muted">No path to SES from this state.</text>
  </g>
  <g aria-label="Preserved synthetic mode">
    <rect x="40" y="2054" width="1120" height="142" rx="14" class="boundary"/>
    <text x="64" y="2093" class="heading">Preserved synthetic mode · a separate runtime path</text>
    <text x="64" y="2129" class="body">Local field rules → same ledger → scripted Strands graph → simulated acceptance.</text>
    <text x="64" y="2166" class="body">Retained sessions keep their mode and receipts. They do not become live activity.</text>
  </g>
  <g aria-label="Legend">
    <text x="40" y="2243" class="label">LEGEND</text>
    <path d="M 160 2236 H 204" class="flow"/>
    <text x="218" y="2243" class="small">Process flow</text>
    <rect x="416" y="2221" width="28" height="24" rx="5" class="provider"/>
    <text x="458" y="2243" class="small">Real provider</text>
