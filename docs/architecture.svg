<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2360" viewBox="0 0 1200 2360" role="img" aria-labelledby="architecture-title architecture-desc">
  <title id="architecture-title">Archon application architecture: evidence, reasoning and exact human approval</title>
  <desc id="architecture-desc">Read from top to bottom. A fresh or retained React workspace accepts manual fictional plain text. Controlled-live intake persists a job before the private worker calls Bedrock for semantic extraction. Deterministic source checks either hold the source for human correction or post it to the ledger. A user-requested Strands graph runs six readers, each with one read-only tool: suppliers, sales, payroll, trading, cash and metrics. All six reports must be present before the toolless composer proposes tone; the ledger supplies the figures. A human approves the exact recipient, subject and body, bound by a SHA-256 fingerprint and explicit real-email consent. The send gate rechecks ledger facts and approval expiry. A durable outbox reserves before controlled Amazon SES sending and retains accepted, failed or unknown outcomes. Provider acceptance does not prove delivery; unknown sends are not automatically retried. The dashed amber incoming extension must be enabled per workspace. External mail or export systems POST to /api/incoming using a separate session-scoped ingest-only Bearer capability. It joins the same API and worker, is distinct from the workspace credential, and cannot trigger reasoning, drafting or sending. Retained synthetic sessions use local field rules, the same ledger and a scripted Strands graph with simulated acceptance. Fictional data is distinct from real providers. No direct mailbox or bank connector, Aurora or AgentCore deployment is represented. This is source architecture; verify served SHAs and exact-pair acceptance for live deployment.</desc>
  <!-- Baseline inspected: 40c7ade. Sources: frontend/src/api.ts; src/archon/web/{workspace,live}.py;
       src/archon/agents/{graph,wiring,gate,draft}.py; src/archon/store/{sessions,execution}.py;
       src/archon/adapters/{grounded_post,ses}.py. Opt-in ingress follows the supplied branch integration
       contract. Source architecture does not attest deployment. Visual verification: CI required. -->
