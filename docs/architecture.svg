<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 660" width="1120" height="660"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
     role="img" aria-labelledby="title desc">
  <title id="title">Archon architecture</title>
  <desc id="desc">An email arrives through Amazon SES, is redacted on the host before anything reads
    it, is read for fields only by Amazon Bedrock, and is posted to a double-entry ledger. Six Strands
    agents read one domain each and feed a composer that holds no tools. The composer writes only a
    greeting and a sign-off; every figure comes from a claim the ledger confirmed. A gate re-derives
    every fact and checks a human approval bound to the exact bytes before one email is sent back out
    through SES.</desc>

  <style>
    .bg    { fill: #ffffff; }
    .box   { fill: #f4f6f9; stroke: #c9d1dc; stroke-width: 1.5; rx: 8; }
    .aws   { fill: #fff4e6; stroke: #e8a33d; stroke-width: 1.5; rx: 8; }
    .code  { fill: #e8f2ec; stroke: #4a9d78; stroke-width: 1.5; rx: 8; }
    .model { fill: #efe9fb; stroke: #8b6fc9; stroke-width: 1.5; rx: 8; }
    .stop  { fill: #fdecec; stroke: #c0504d; stroke-width: 1.5; rx: 8; }
    .h     { font-size: 14px; font-weight: 700; fill: #14171f; }
    .t     { font-size: 12px; fill: #3d4451; }
    .s     { font-size: 11px; fill: #5c6472; }
    .lab   { font-size: 11px; fill: #5c6472; font-style: italic; }
    .key   { font-size: 11px; fill: #3d4451; }
    .arrow { stroke: #8b93a1; stroke-width: 1.6; fill: none; marker-end: url(#a); }
    .band  { fill: none; stroke: #c9d1dc; stroke-width: 1.2; stroke-dasharray: 5 4; rx: 10; }
  </style>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b93a1"/>
    </marker>
  </defs>

  <rect class="bg" width="1120" height="660"/>

  <text x="28" y="34" class="h" font-size="17">Archon — the back office that lives in an inbox</text>
  <text x="28" y="54" class="s">Every figure is computed by the ledger. The model is asked for
    judgement and tone, never for a number, and never for permission.</text>

  <!-- key -->
  <g transform="translate(760,26)">
    <rect class="aws" x="0" y="0" width="14" height="14"/><text x="20" y="11" class="key">AWS</text>
    <rect class="model" x="70" y="0" width="14" height="14"/><text x="90" y="11" class="key">model</text>
    <rect class="code" x="150" y="0" width="14" height="14"/><text x="170" y="11" class="key">plain code</text>
    <rect class="stop" x="255" y="0" width="14" height="14"/><text x="275" y="11" class="key">refusal</text>
  </g>

  <!-- row 1: intake -->
  <text x="28" y="94" class="lab">1 · the post arrives, and is made safe before anything reads it</text>

  <rect class="aws" x="28" y="104" width="180" height="66"/>
  <text x="44" y="128" class="h">Amazon SES</text>
  <text x="44" y="147" class="t">an email, or a PDF</text>
  <text x="44" y="162" class="s">attachment</text>

  <rect class="code" x="248" y="104" width="200" height="66"/>
  <text x="264" y="128" class="h">Redact, on this host</text>
  <text x="264" y="147" class="t">IBAN · card · tax id · phone</text>
  <text x="264" y="162" class="s">PDF text extracted locally</text>

  <rect class="model" x="488" y="104" width="200" height="66"/>
  <text x="504" y="128" class="h">Bedrock reads fields</text>
  <text x="504" y="147" class="t">claude-opus-5</text>
  <text x="504" y="162" class="s">extraction, never a decision</text>

  <rect class="code" x="728" y="104" width="220" height="66"/>
  <text x="744" y="128" class="h">Double-entry ledger</text>
  <text x="744" y="147" class="t">Aurora DSQL · SQLite</text>
  <text x="744" y="162" class="s">refuses what does not add up</text>

  <path class="arrow" d="M 208 137 H 246"/>
  <path class="arrow" d="M 448 137 H 486"/>
  <path class="arrow" d="M 688 137 H 726"/>

  <!-- row 2: the six -->
  <text x="28" y="216" class="lab">2 · six Strands agents, one domain each, asked what only that domain can judge</text>
  <rect class="band" x="20" y="226" width="700" height="112"/>

  <g class="t">
    <rect class="model" x="36" y="242" width="102" height="38"/>
    <text x="50" y="266" class="t">suppliers</text>
    <rect class="model" x="150" y="242" width="102" height="38"/>
    <text x="164" y="266" class="t">sales</text>
    <rect class="model" x="264" y="242" width="102" height="38"/>
    <text x="278" y="266" class="t">payroll</text>
    <rect class="model" x="378" y="242" width="102" height="38"/>
    <text x="392" y="266" class="t">trading</text>
    <rect class="model" x="492" y="242" width="102" height="38"/>
    <text x="506" y="266" class="t">cash</text>
    <rect class="model" x="606" y="242" width="98" height="38"/>
    <text x="620" y="266" class="t">metrics</text>
  </g>
  <text x="36" y="304" class="s">Each returns its reading and a view ending URGENT, WATCH or FINE. They disagree,
    and the disagreement is the point.</text>
  <text x="36" y="322" class="s">Every tool here is a read. No sequence of calls an agent invents can change the
    books or reach a client.</text>

  <path class="arrow" d="M 838 170 V 200 H 375 V 240"/>

  <rect class="model" x="760" y="242" width="190" height="80"/>
  <text x="776" y="266" class="h">Composer</text>
  <text x="776" y="285" class="t">holds no tools at all</text>
  <text x="776" y="303" class="s">every edge into it waits</text>
  <text x="776" y="317" class="s">for all six reports</text>

  <path class="arrow" d="M 706 261 H 758"/>

  <!-- row 3: the draft -->
  <text x="28" y="374" class="lab">3 · the draft, where the agent writes two lines and the ledger writes every figure</text>

  <rect class="code" x="28" y="384" width="290" height="84"/>
  <text x="44" y="408" class="h">Claims</text>
  <text x="44" y="427" class="t">outstanding · days overdue</text>
  <text x="44" y="443" class="t">part paid · wages due · statutory interest</text>
  <text x="44" y="460" class="s">each verifies itself against the books</text>

  <rect class="code" x="358" y="384" width="290" height="84"/>
  <text x="374" y="408" class="h">Draft</text>
  <text x="374" y="427" class="t">agent writes a greeting and a sign-off</text>
  <text x="374" y="443" class="t">refused outright if either holds a digit</text>
  <text x="374" y="460" class="s">fingerprinted, SHA-256 of the exact bytes</text>

  <path class="arrow" d="M 855 322 V 350 H 500 V 382"/>
  <path class="arrow" d="M 318 426 H 356"/>

  <!-- row 4: the gate, which branches rather than chains -->
  <text x="28" y="500" class="lab">4 · the gate, which is plain code, because safety that depends on a model behaving is not safety</text>

  <rect class="code" x="28" y="510" width="330" height="112"/>
  <text x="44" y="534" class="h">Gate</text>
  <text x="44" y="553" class="t">re-derives every fact at send time</text>
  <text x="44" y="570" class="t">matches the human approval, byte for byte</text>
  <text x="44" y="587" class="t">approval expires in thirty minutes</text>
  <text x="44" y="607" class="s">it decides; it never sends</text>

  <rect class="aws" x="470" y="500" width="290" height="56"/>
  <text x="486" y="522" class="h">Amazon SES — one email</text>
  <text x="486" y="541" class="t">sent once, with a receipt, or not called sent</text>

  <rect class="stop" x="470" y="576" width="290" height="56"/>
  <text x="486" y="598" class="h">Held — nothing is sent</text>
  <text x="486" y="617" class="t">paid at lunchtime · a word changed · wrong address</text>

  <path class="arrow" d="M 358 552 H 410 V 528 H 468"/>
  <path class="arrow" d="M 358 578 H 410 V 604 H 468"/>
  <text x="372" y="522" class="s">released</text>
  <text x="372" y="628" class="s">held</text>

  <path class="arrow" d="M 500 468 V 490 H 193 V 508"/>

  <text x="790" y="600" class="s">A sentence printed inside an</text>
  <text x="790" y="616" class="s">invoice cannot reach a decision</text>
  <text x="790" y="632" class="s">that no model makes.</text>

</svg>
