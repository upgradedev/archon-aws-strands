<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2420" viewBox="0 0 1200 2420" role="img" aria-labelledby="infrastructure-title infrastructure-desc">
  <title id="infrastructure-title">Archon AWS infrastructure: public API, private provider worker and separate deployment boundary</title>
  <desc id="infrastructure-desc">The browser uses HTTPS to CloudFront. CloudFront fetches the React static site from private S3 using Origin Access Control and routes uncached same-origin API requests through API Gateway to the API Lambda. The API persists session state and pending requests to private S3 before asynchronously invoking the private provider Lambda. The API IAM role explicitly denies direct Bedrock model invocation and all SES actions. Only the worker has bounded provider permissions: Bedrock through an EU inference profile and SES for the configured sender and verified recipient before grant expiry and after exact human approval. Both Lambdas access the sessions namespace; only the worker accesses the provider namespace containing operating grants, call journals and the durable outbox. Conditional S3 writes use ETag compare-and-swap. The worker's asynchronous failure destination is retained encrypted SQS, with no automatic resend and zero function-error retries. CloudWatch receives API and worker logs and monitors API errors and SQS backlog. Private means IAM-only invocation; no VPC or subnet deployment is asserted. The dashed amber extension is source-ready, not deployed: external mail or export systems POST to /api/incoming using a separate session-scoped ingest-only Bearer capability. The owner manages it with GET or POST /api/incoming/connection. Grant records share the sessions namespace with a distinct record_type and cannot be read through the workspace session API. No new IAM, storage or worker is required by this contract. Only real intake is enqueued: worker Bedrock semantic extraction, deterministic source checks, then ledger posting. Ingress cannot trigger a Strands reasoning graph, draft or send. Below the runtime boundary, GitHub Actions verifies and packages source; GitHub OIDC authorizes a main-scoped frontend release to S3 and CloudFront. Backend ZIP deployment remains a separate operator action. No deployed Aurora, AgentCore, mailbox connector or bank feed is represented.</desc>
  <!-- Baseline inspected: 40c7ade. Sources: infra/{frontend_stack,archon_api_stack}.py;
       deploy/{live_api_stack,live_provider_stack}.py; .github/workflows/{frontend-deploy,aws-api-package}.yml;
       src/archon/web/live.py; src/archon/store/{sessions,execution}.py.
       Future webhook endpoints and grant isolation follow the supplied integration contract, not a deployed claim.
       Visual verification: CI required. -->
